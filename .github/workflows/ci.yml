name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run backend tests
        run: python -m pytest tests/test_signallog.py -q
      - name: Lint backend
        run: ruff check .
      - name: Type-check backend
        run: mypy app tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  clean-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run README setup commands on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          py -3.12 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
          .\.venv\Scripts\python.exe -m alembic upgrade head
          .\.venv\Scripts\python.exe -m pytest tests\test_signallog.py -q
      - name: Run README setup commands on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3.12 -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -e ".[dev]"
          ./.venv/bin/python -m alembic upgrade head
          ./.venv/bin/python -m pytest tests/test_signallog.py -q
      - name: Install web dependencies from the README
        working-directory: web
        run: npm ci
      - name: Verify clean web install
        working-directory: web
        run: npm run typecheck
      - name: Build after clean install
        working-directory: web
        run: npm run build
