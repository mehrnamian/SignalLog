[project]
name = "SignalLog"
version = "0.1.0"
description = "Local-only reliability signal log for checks and results"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
